<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SigmaAgents Tabs</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111315;
        --panel: #1b1f23;
        --panel-active: #f4f1ea;
        --text: #f8f7f7;
        --muted: #8e969f;
        --accent: #4fb3a3;
        --border: #2c3238;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-app-region: drag;
        user-select: none;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 54px 8px 10px;
        border-right: 1px solid var(--border);
        gap: 10px;
      }

      #tabs,
      #tools {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        width: 100%;
      }

      #tools {
        margin-top: auto;
      }

      button {
        -webkit-app-region: no-drag;
        width: 56px;
        min-width: 56px;
        height: 48px;
        min-height: 48px;
        border: 1px solid transparent;
        border-radius: 8px;
        appearance: none;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1;
        cursor: default;
      }

      button:not(:disabled):hover {
        border-color: var(--border);
        background: var(--panel);
        color: var(--text);
      }

      button[data-active="true"] {
        border-color: transparent;
        background: var(--panel-active);
        color: #171717;
        box-shadow: inset 3px 0 0 var(--accent);
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button:disabled {
        opacity: 0.35;
      }

      .tool {
        height: 36px;
        min-height: 36px;
        font-size: 18px;
        font-weight: 500;
      }

      .app-tool {
        font-size: 12px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <nav id="tabs" aria-label="Tabs"></nav>
      <nav id="tools" aria-label="Navigation">
        <button class="tool" id="back" title="Back" aria-label="Back">&lt;</button>
        <button class="tool" id="forward" title="Forward" aria-label="Forward">&gt;</button>
        <button class="tool" id="reload" title="Reload" aria-label="Reload">R</button>
        <button class="tool app-tool" id="settings" title="Settings" aria-label="Settings">S</button>
        <button class="tool app-tool" id="help" title="Help" aria-label="Help">?</button>
      </nav>
    </main>
    <script>
      const api = window.desktopTabs
      const tabs = document.getElementById("tabs")
      const back = document.getElementById("back")
      const forward = document.getElementById("forward")
      const reload = document.getElementById("reload")
      const settings = document.getElementById("settings")
      const help = document.getElementById("help")
      let state = {
        active: "opencode",
        tabs: [
          { id: "opencode", title: "OpenCode", label: "OC" },
          { id: "7777", title: "7777", label: "7777" },
          { id: "plm", title: "PLM", label: "PLM" },
        ],
        navigation: {
          canGoBack: false,
          canGoForward: false,
        },
      }

      function render() {
        tabs.replaceChildren(
          ...state.tabs.map((tab) => {
            const button = document.createElement("button")
            button.type = "button"
            button.textContent = tab.label
            button.title = tab.title
            button.setAttribute("aria-label", tab.title)
            button.dataset.active = String(tab.id === state.active)
            button.addEventListener("click", () => api.select(tab.id))
            return button
          }),
        )

        back.disabled = !state.navigation.canGoBack
        forward.disabled = !state.navigation.canGoForward
      }

      back.addEventListener("click", () => api.back())
      forward.addEventListener("click", () => api.forward())
      reload.addEventListener("click", () => api.reload())
      settings.addEventListener("click", () => api.action("settings"))
      help.addEventListener("click", () => api.action("help"))
      api.subscribe((next) => {
        state = next
        render()
      })
      render()
    </script>
  </body>
</html>
