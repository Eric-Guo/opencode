<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SigmaAgents Tabs</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12121f;
        --surface: #1b1b2e;
        --text: #ffffff;
        --muted: #a0a0c0;
        --accent: #38bdf8;
        --border: #3a3a5c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-app-region: drag;
        user-select: none;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 54px 8px 8px;
        border-right: 1px solid var(--border);
        gap: 8px;
      }

      #tabs,
      #tools {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        width: 100%;
      }

      #tools {
        margin-top: auto;
      }

      button {
        -webkit-app-region: no-drag;
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        cursor: pointer;
      }

      .tab-button {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        width: 56px;
        min-width: 56px;
        height: 56px;
        min-height: 56px;
        padding: 0;
        border-radius: 12px;
        transition: 0.25s;
      }

      .tab-button:hover {
        background: var(--surface);
        color: var(--text);
      }

      .tab-button[data-active="true"] {
        background: rgb(56 189 248 / 12%);
        color: var(--accent);
      }

      .tab-button[data-active="true"]::before {
        position: absolute;
        top: 50%;
        left: -8px;
        width: 3px;
        height: 24px;
        border-radius: 0 2px 2px 0;
        background: var(--accent);
        content: "";
        transform: translateY(-50%);
      }

      .tab-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        font-size: 22px;
        line-height: 1;
      }

      .tab-icon svg {
        display: block;
        width: 24px;
        height: 24px;
        color: var(--text);
      }

      .tab-icon-opencode {
        background: linear-gradient(135deg, #c084fc 0%, #818cf8 50%, #38bdf8 100%);
        background-clip: text;
        color: transparent;
        font-family: "Times New Roman", serif;
        font-size: 24px;
        font-weight: 700;
        filter: drop-shadow(0 0 2px rgb(192 132 252 / 30%));
      }

      .tab-button[data-active="true"] .tab-icon-opencode {
        filter: drop-shadow(0 0 4px rgb(56 189 248 / 50%));
      }

      .tab-label {
        color: currentColor;
        font-size: 10px;
        font-weight: 500;
        line-height: 1.2;
        text-align: center;
        transition: color 0.25s;
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button:disabled {
        opacity: 0.35;
      }

      .tool {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        min-width: 56px;
        height: 36px;
        min-height: 36px;
        padding: 0;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 500;
      }

      .tool:not(:disabled):hover {
        background: var(--surface);
        color: var(--text);
      }

      #changelog {
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <nav id="tabs" aria-label="Tabs"></nav>
      <nav id="tools" aria-label="Navigation">
        <button class="tab-button" id="help" title="Help" aria-label="Help">
          <span class="tab-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M9.8 9a2.4 2.4 0 1 1 3.5 2.15c-.8.45-1.3 1.05-1.3 1.85v.4" />
              <path d="M12 17h.01" />
            </svg>
          </span>
        </button>
        <button class="tool" id="settings" title="Settings" aria-label="Settings">
          <span class="tab-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15a1.7 1.7 0 0 0-1.55-1.03H3v-4h.08A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1.03-1.55V3h4v.08A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9a1.7 1.7 0 0 0 1.55 1.03H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z" />
            </svg>
          </span>
        </button>
      </nav>
    </main>
    <script>
      const api = window.desktopTabs
      const tabs = document.getElementById("tabs")
      const settings = document.getElementById("settings")
      const help = document.getElementById("help")
      const icons = {
        archx:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="12" rx="10" ry="4.5"/><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(120 12 12)"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>',
        inspiration:
          '<svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12.5 24.5c-2.7-1.8-4.5-4.9-4.5-8.4a10 10 0 0 1 20 0c0 3.5-1.8 6.6-4.5 8.4-1.1.8-1.5 1.5-1.5 2.5h-8c0-1-.4-1.7-1.5-2.5Z"/><path d="M14 30h8M15.5 33h5M18 1v3M4.5 6.5l2.2 2.2M31.5 6.5l-2.2 2.2M2 17h3M31 17h3"/></svg>',
        opencode: "Σ",
        worktime:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="12" r="8"/><path d="M10 7v5l-3 3M15.5 18.5l4.8-4.8 1.7 1.7-4.8 4.8-2.7.7.7-2.4Z"/></svg>',
      }
      let state = {
        active: "opencode",
        tabs: [
          { id: "opencode", title: "OpenCode", label: "Sigema", skipDisplay: false },
          { id: "worktime", title: "工时填报", label: "工时填报", skipDisplay: false },
          { id: "archx", title: "ArchX", label: "ArchX", skipDisplay: false },
          { id: "inspiration", title: "灵感采集", label: "灵感采集", skipDisplay: false },
        ],
        navigation: {
          canGoBack: false,
          canGoForward: false,
        },
      }

      function render() {
        tabs.replaceChildren(
          ...state.tabs.filter((tab) => !tab.skipDisplay).map((tab) => {
            const button = document.createElement("button")
            button.type = "button"
            button.className = "tab-button"
            button.title = tab.title
            button.setAttribute("aria-label", tab.title)
            button.dataset.active = String(tab.id === state.active)
            const icon = document.createElement("span")
            icon.className = `tab-icon tab-icon-${tab.id}`
            icon.setAttribute("aria-hidden", "true")
            if (icons[tab.id]) icon.innerHTML = icons[tab.id]
            if (!icons[tab.id]) icon.textContent = tab.label.slice(0, 1)
            const label = document.createElement("span")
            label.className = "tab-label"
            label.textContent = tab.label
            button.append(icon, label)
            button.addEventListener("click", () => api.select(tab.id))
            return button
          }),
        )
      }

      settings.addEventListener("click", () => api.action("settings"))
      help.addEventListener("click", () => api.action("help"))
      api.subscribe((next) => {
        state = next
        render()
      })
      render()
    </script>
  </body>
</html>
